services:
  pg:
    image: postgres:16.3-alpine
    restart: always
    env_file:
      - "../.env"
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    ports:
      - 5432:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
  

  nginx:
    image: nginx:1.19.2-alpine
    hostname: nginx
    ports:
      - "9000:9000"
      - "9001:9001"
  